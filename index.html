h:100%;display:block;text-align:left;border:0;background:transparent}.list button.active{background:var(--g);color:white}.drawer input{width:100%;margin:10px 0}.settings{position:fixed;right:18px;top:70px;z-index:15;width:280px;background:white;border-radius:16px;padding:14px;box-shadow:0 12px 35px #0002;display:none}.settings.on{display:block}.settings label{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font:14px sans-serif}.settings select{max-width:165px}.close{float:right}@media(max-width:650px){.top{flex-wrap:wrap}.top h1{font-size:18px}.search{order:3;width:100%;margin:0}.page{padding:12px}.card{min-height:calc(100vh - 140px);padding:25px 16px}.text{font-size:22px}.title{font-size:29px}.rateTop{display:none}}

</style></head><body><header class="top"><button id="menu">☰</button><h1>古诗朗读</h1><input id="search" class="search" placeholder="搜索诗名、作者、朝代或诗句"><label class="rateTop">速度 <select id="rate"><option>.6</option><option selected>.8</option><option>1</option><option>1.2</option><option>1.4</option><option>1.6</option><option>1.8</option><option>2</option></select></label><button id="gear">⚙</button></header><main class="page"><article class="card"><div id="count" class="count"></div><h2 id="title" class="title"></h2><div id="meta" class="meta"></div><div id="text" class="text"></div><div class="controls"><button id="prev">上一首</button><button id="play" class="primary">▶ 播放</button><button id="next">下一首</button><button id="restart">从头播放</button></div><div id="status" class="status">无需导入MP3，点击播放即可慢速朗读。</div></article></main><audio id="mediaBridge" src="media-bridge.wav" loop preload="auto" playsinline></audio><div id="shade" class="shade"></div><aside id="drawer" class="drawer"><div><h2 style="display:inline">古诗目录</h2><button id="close" class="close">×</button></div><input id="dsearch" placeholder="目录中搜索"><nav id="list" class="list"></nav></aside><section id="settings" class="settings"><label>中文语音<select id="voice"><option value="">自动选择</option></select></label><label>速度<select id="rate2"><option>.6</option><option selected>.8</option><option>1</option><option>1.2</option><option>1.4</option><option>1.6</option><option>1.8</option><option>2</option></select></label><label>列表循环<input id="loop" type="checkbox" checked></label><label>单首循环<input id="single" type="checkbox"></label></section><script>const poems=[{"title": "悯农（其二）", "dynasty": "唐", "author": "李绅", "text": "锄禾日当午，\n汗滴禾下土。\n谁知盘中餐，\n粒粒皆辛苦。"}, {"title": "池上", "dynasty": "唐", "author": "白居易", "text": "小娃撑小艇，\n偷采白莲回。\n不解藏踪迹，\n浮萍一道开。"}, {"title": "小池", "dynasty": "宋", "author": "杨万里", "text": "泉眼无声惜细流，\n树阴照水爱晴柔。\n小荷才露尖尖角，\n早有蜻蜓立上头。"}, {"title": "小儿垂钓", "dynasty": "唐", "author": "胡令能", "text": "蓬头稚子学垂纶，\n侧坐莓苔草映身。\n路人借问遥招手，\n怕得鱼惊不应人。"}, {"title": "江雪", "dynasty": "唐", "author": "柳宗元", "text": "千山鸟飞绝，\n万径人踪灭。\n孤舟蓑笠翁，\n独钓寒江雪。"}, {"title": "敕勒歌", "dynasty": "北朝民歌", "author": "佚名", "text": "敕勒川，阴山下。\n天似穹庐，笼盖四野。\n天苍苍，野茫茫，\n风吹草低见牛羊。"}, {"title": "村居", "dynasty": "清", "author": "高鼎", "text": "草长莺飞二月天，\n拂堤杨柳醉春烟。\n儿童散学归来早，\n忙趁东风放纸鸢。"}, {"title": "悯农（其一）", "dynasty": "唐", "author": "李绅", "text": "春种一粒粟，\n秋收万颗子。\n四海无闲田，\n农夫犹饿死。"}, {"title": "所见", "dynasty": "清", "author": "袁枚", "text": "牧童骑黄牛，\n歌声振林樾。\n意欲捕鸣蝉，\n忽然闭口立。"}, {"title": "元日", "dynasty": "宋", "author": "王安石", "text": "爆竹声中一岁除，\n春风送暖入屠苏。\n千门万户曈曈日，\n总把新桃换旧符。"}, {"title": "清明", "dynasty": "唐", "author": "杜牧", "text": "清明时节雨纷纷，\n路上行人欲断魂。\n借问酒家何处有？\n牧童遥指杏花村。"}, {"title": "九月九日忆山东兄弟", "dynasty": "唐", "author": "王维", "text": "独在异乡为异客，\n每逢佳节倍思亲。\n遥知兄弟登高处，\n遍插茱萸少一人。"}, {"title": "四时田园杂兴（其二十五）", "dynasty": "宋", "author": "范成大", "text": "梅子金黄杏子肥，\n麦花雪白菜花稀。\n日长篱落无人过，\n惟有蜻蜓蛱蝶飞。"}, {"title": "渔歌子", "dynasty": "唐", "author": "张志和", "text": "西塞山前白鹭飞，\n桃花流水鳜鱼肥。\n青箬笠，绿蓑衣，\n斜风细雨不须归。"}, {"title": "四时田园杂兴（其三十一）", "dynasty": "宋", "author": "范成大", "text": "昼出耘田夜绩麻，\n村庄儿女各当家。\n童孙未解供耕织，\n也傍桑阴学种瓜。"}, {"title": "乡村四月", "dynasty": "宋", "author": "翁卷", "text": "绿遍山原白满川，\n子规声里雨如烟。\n乡村四月闲人少，\n才了蚕桑又插田。"}, {"title": "长歌行", "dynasty": "汉乐府", "author": "佚名", "text": "青青园中葵，朝露待日晞。\n阳春布德泽，万物生光辉。\n常恐秋节至，焜黄华叶衰。\n百川东到海，何时复西归？\n少壮不努力，老大徒伤悲！"}, {"title": "江上渔者", "dynasty": "宋", "author": "范仲淹", "text": "江上往来人，\n但爱鲈鱼美。\n君看一叶舟，\n出没风波里。"}],$=id=>document.getElementById(id);let i=0,token=0,speaking=false,paused=false,voices=[],q='';function norm(x){return String(x).replace(/\s/g,'').toLowerCase()}function renderList(){const v=norm(q);$('list').innerHTML='';poems.forEach((p,n)=>{if(v&&!norm(p.title+p.author+p.dynasty+p.text).includes(v))return;let b=document.createElement('button');b.textContent=`${n+1}. ${p.title} · ${p.author}`;b.classList.toggle('active',n===i);b.onclick=()=>{select(n,true);drawer(false)};$('list').appendChild(b)})}function render(){let p=poems[i];$('count').textContent=`第 ${i+1} 首 / 共 ${poems.length} 首`;$('title').textContent=p.title;$('meta').textContent=`${p.dynasty} · ${p.author}`;$('text').textContent=p.text;renderList()}function drawer(on){$('drawer').classList.toggle('on',on);$('shade').classList.toggle('on',on)}function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>/^zh/i.test(v.lang));$('voice').innerHTML='<option value="">自动选择最佳中文语音</option>';voices.forEach(v=>$('voice').add(new Option(v.name+' ('+v.lang+')',v.name)))}function getVoice(){let x=$('voice').value;if(x)return voices.find(v=>v.name===x);for(const k of ['Yunxi','Yunjian','Yunyang','Kangkang','Xiaoxiao','Microsoft','Google']){let v=voices.find(x=>x.name.includes(k));if(v)return v}return voices[0]}function stop(){token++;speechSynthesis.cancel();speaking=paused=false;$('play').textContent='▶ 播放'}function speak(){stop();let t=token,p=poems[i],parts=[{x:p.title,d:900},{x:`${p.dynasty}，${p.author}`,d:1100},...p.text.split('\n').filter(Boolean).map((x,n)=>({x,d:n%2?1100:750}))],n=0;speaking=true;$('play').textContent='❚❚ 暂停';$('status').textContent='正在朗读：'+p.title;function go(){if(t!==token)return;if(n===parts.length){speaking=false;$('play').textContent='▶ 播放';return setTimeout(()=>{if(t!==token)return;if($('single').checked)speak();else if(i<poems.length-1)select(i+1,true);else if($('loop').checked)select(0,true)},1400)}let a=parts[n++],u=new SpeechSynthesisUtterance(a.x);u.lang='zh-CN';u.rate=Math.max(.2,+$('rate').value*.82);u.pitch=.94;let v=getVoice();if(v)u.voice=v;u.onend=()=>setTimeout(go,a.d);u.onerror=e=>{if(e.error!=='canceled')$('status').textContent='当前设备没有可用中文语音，请在设置中更换语音。'};speechSynthesis.speak(u)}go()}function toggle(){if(paused){speechSynthesis.resume();paused=false;speaking=true;$('play').textContent='❚❚ 暂停'}else if(speaking){speechSynthesis.pause();paused=true;$('play').textContent='▶ 继续'}else speak()}function select(n,a){stop();i=(n+poems.length)%poems.length;render();if(a)setTimeout(speak,300)}$('menu').onclick=()=>drawer(true);$('close').onclick=() =>drawer(false);$('shade').onclick=()=>drawer(false);$('gear').onclick=()=> $('settings').classList.toggle('on');$('search').oninput=e=>{q=e.target.value;$('dsearch').value=q;renderList()};$('dsearch').oninput=e=>{q=e.target.value;$('search').value=q;renderList()};$('play').onclick=toggle;$('prev').onclick=()=>select(i-1,true);$('next').onclick=()=>select(i+1,true);$('restart').onclick=speak;$('rate').onchange=e=>{$('rate2').value=e.target.value;if(speaking)speak()};$('rate2').onchange=e=>{$('rate').value=e.target.value;if(speaking)speak()};$('voice').onchange=()=>{if(speaking)speak()};speechSynthesis.onvoiceschanged=loadVoices;loadVoices();render();
// V3.2: mobile lock-screen media controls
const bridge=$('mediaBridge');
bridge.volume=0.01;
let bridgeStarted=false;
async function startMediaBridge(){
  if(bridgeStarted&&!bridge.paused)return;
  try{await bridge.play();bridgeStarted=true;}catch(e){console.warn('Media bridge needs a user tap',e)}
}
function stopMediaBridge(){try{bridge.pause();bridge.currentTime=0}catch(e){}bridgeStarted=false}
function updateMediaSession(){
  if(!('mediaSession' in navigator))return;
  const p=poems[i];
  navigator.mediaSession.metadata=new MediaMetadata({
    title:p.title,
    artist:`${p.dynasty} · ${p.author}`,
    album:'古诗朗读',
    artwork:[
      {src:'icon-192.png',sizes:'192x192',type:'image/png'},
      {src:'icon-512.png',sizes:'512x512',type:'image/png'}
    ]
  });
  navigator.mediaSession.playbackState=(speaking&&!paused)?'playing':'paused';
}
if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('play',()=>{startMediaBridge();if(paused){speechSynthesis.resume();paused=false;speaking=true;$('play').textContent='❚❚ 暂停'}else if(!speaking)speak();updateMediaSession()});
  navigator.mediaSession.setActionHandler('pause',()=>{if(speaking&&!paused){speechSynthesis.pause();paused=true;$('play').textContent='▶ 继续'}updateMediaSession()});
  navigator.mediaSession.setActionHandler('previoustrack',()=>select(i-1,true));
  navigator.mediaSession.setActionHandler('nexttrack',()=>select(i+1,true));
  navigator.mediaSession.setActionHandler('stop',()=>{stop();stopMediaBridge();updateMediaSession()});
}
// Wrap existing functions so metadata and the audio session stay synchronized.
const _speak=speak;speak=function(){startMediaBridge();_speak();setTimeout(updateMediaSession,50)};
const _stop=stop;stop=function(){_stop();updateMediaSession()};
const _select=select;select=function(n,a){_select(n,a);setTimeout(updateMediaSession,60)};
const _toggle=toggle;toggle=function(){startMediaBridge();_toggle();setTimeout(updateMediaSession,60)};
$('play').onclick=toggle;
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateMediaSession()});
window.addEventListener('pagehide',()=>{if(!speaking)stopMediaBridge()});
updateMediaSession();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
